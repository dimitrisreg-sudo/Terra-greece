<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Terra Greece v0.6</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
</head>
<body>
  <div id="map"></div>
  <div class="brand">🌿 Terra Greece<small>Εξερεύνηση ελληνικής φύσης · v0.6</small></div>
  <div class="rail">
    <button id="btnBase" title="Υπόβαθρα" aria-label="Υπόβαθρα">▧</button>
    <button id="btnLayers" title="Επίπεδα" aria-label="Επίπεδα">◫</button>
    <button id="btnSpecies" title="Ζώα, φυτά, μανιτάρια" aria-label="Είδη">🦉</button>
    <button id="btnLocate" title="Η θέση μου" aria-label="Η θέση μου">⌖</button>
    <button id="btnHome" title="Όλυμπος" aria-label="Όλυμπος">⌂</button>
  </div>
  <section class="sheet" id="sheet">
    <button class="close" id="closeSheet">×</button>
    <div id="sheetContent"></div>
  </section>
  <section class="info" id="info">
    <button class="close" id="closeInfo">×</button>
    <div id="infoContent"></div>
  </section>
  <button class="pin" id="pin">📍 Επίλεξε σημείο στον χάρτη</button>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
