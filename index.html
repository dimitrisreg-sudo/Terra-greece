<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Terra Greece v0.6</title><link rel="stylesheet" href="./vendor/leaflet/leaflet.css"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18382e}*{box-sizing:border-box}body{margin:0}#map{height:100vh;height:100dvh;width:100%;background:#dfe8df}.brand{position:absolute;z-index:800;top:calc(env(safe-area-inset-top) + 14px);left:14px;background:#fffefbf0;box-shadow:0 3px 18px #0002;border-radius:14px;padding:10px 15px;font-weight:800;letter-spacing:.2px}.brand small{display:block;color:#63776a;font-size:11px;font-weight:500}.rail{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 90px);z-index:900;display:grid;gap:9px}.rail button,.close{border:0;background:white;border-radius:13px;width:48px;height:48px;font-size:23px;box-shadow:0 3px 16px #0003;cursor:pointer}.rail button.active{background:#245b47;color:white}.sheet{position:absolute;z-index:1000;right:72px;top:calc(env(safe-area-inset-top) + 90px);width:min(340px,calc(100vw - 90px));max-height:calc(100dvh - 125px);overflow:auto;background:white;border-radius:16px;box-shadow:0 5px 28px #0004;padding:17px;display:none}.sheet.open{display:block}.sheet h2{font-size:18px;margin:0 40px 10px 0}.sheet .close{position:absolute;right:10px;top:10px;box-shadow:none;background:#f1f5f2;width:32px;height:32px;font-size:18px}.muted{color:#657a70;font-size:12px;line-height:1.5}.option{display:flex;gap:10px;align-items:center;border-bottom:1px solid #edf1ee;padding:11px 0;font-size:14px}.option input{accent-color:#277a57}.sheet input[type=search],.sheet select{width:100%;border:1px solid #cbd9cf;border-radius:9px;padding:11px;margin:5px 0 9px;background:white}.sheet button.action{background:#245b47;color:white;border:0;border-radius:10px;padding:10px;width:100%;font-weight:600}.sheet .entry{padding:10px 0;border-bottom:1px solid #e9eee9;cursor:pointer}.entry strong{display:block;font-size:14px}.entry small{color:#697a70}.pin{position:absolute;z-index:850;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);border:0;border-radius:30px;padding:12px 19px;background:#205943;color:white;box-shadow:0 4px 20px #0004;font-weight:700}.info{position:absolute;z-index:950;bottom:calc(env(safe-area-inset-bottom) + 72px);left:12px;width:min(370px,calc(100vw - 88px));max-height:50dvh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 5px 22px #0004;padding:16px;display:none}.info.open{display:block}.info h2{font-size:16px;margin:0 25px 10px 0}.info .close{position:absolute;right:9px;top:9px;background:#edf3ef;box-shadow:none;width:29px;height:29px;font-size:16px}.metric{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #eef2ef;font-size:13px}.metric b{text-align:right}.notice{background:#edf5ef;padding:10px;border-radius:10px;font-size:12px;line-height:1.5;margin-top:10px}.error{position:absolute;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;text-align:center;background:#edf3ee;padding:30px}.error>div{max-width:350px}.leaflet-control-attribution{font-size:9px!important}@media(min-width:800px){.sheet{right:74px;width:360px}.info{bottom:25px}}
</style></head><body><div id="map"></div><div class="brand">🌿 Terra Greece<small>Εξερεύνηση ελληνικής φύσης · v0.6</small></div><div class="rail"><button id="btnBase" title="Υπόβαθρα" aria-label="Υπόβαθρα">▧</button><button id="btnLayers" title="Επίπεδα" aria-label="Επίπεδα">◫</button><button id="btnSpecies" title="Ζώα, φυτά, μανιτάρια" aria-label="Είδη">🦉</button><button id="btnLocate" title="Η θέση μου" aria-label="Η θέση μου">⌖</button><button id="btnHome" title="Όλυμπος" aria-label="Όλυμπος">⌂</button></div><section class="sheet" id="sheet"><button class="close" id="closeSheet">×</button><div id="sheetContent"></div></section><section class="info" id="info"><button class="close" id="closeInfo">×</button><div id="infoContent"></div></section><button class="pin" id="pin">📍 Επίλεξε σημείο στον χάρτη</button><script src="./vendor/leaflet/leaflet.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let map,marker,base,geoLayer,obsLayer,selected=null,activePanel='',speciesRecords=[],requestId=0;
const BASES={sat:{name:'Δορυφορικός',url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',attr:'Imagery © Esri, Maxar, Earthstar Geographics'},osm:{name:'Απλός χάρτης',url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',attr:'© OpenStreetMap contributors'},topo:{name:'Τοπογραφικός',url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',attr:'© OpenTopoMap, © OpenStreetMap'}};
function showPanel(type){activePanel=type;const panel=$('sheet'),content=$('sheetContent');panel.classList.add('open');document.querySelectorAll('.rail button').forEach(b=>b.classList.remove('active'));if(type==='base'){$('btnBase').classList.add('active');content.innerHTML='<h2>Υπόβαθρο χάρτη</h2>'+Object.entries(BASES).map(([key,b])=>`<label class="option"><input type="radio" name="base" value="${key}" ${base?.key===key?'checked':''}>${b.name}</label>`).join('')+'<label class="option"><input type="radio" name="base" value="geology" '+(base?.key==='geology'?'checked':'')+'>Γεωλογικός χάρτης (Macrostrat)</label><p class="muted">Ο γεωλογικός χάρτης είναι χαρτογραφική σύνθεση και η κάλυψή του ενδέχεται να διαφέρει ανά περιοχή.</p>';content.querySelectorAll('input').forEach(i=>i.onchange=()=>setBase(i.value));}
else if(type==='layers'){$('btnLayers').classList.add('active');content.innerHTML='<h2>Επίπεδα</h2><label class="option"><input id="geocheck" type="checkbox" '+(map.hasLayer(geoLayer)?'checked':'')+'> Γεωλογία πάνω στο υπόβαθρο</label><label class="option"><input id="obscheck" type="checkbox" '+(map.hasLayer(obsLayer)?'checked':'')+'> Σημεία επιλεγμένου είδους</label><p class="muted">Οι γεωλογικοί σχηματισμοί προέρχονται από Macrostrat. Οι καταγραφές ειδών από GBIF δεν αποτελούν εκτιμήσεις πληθυσμών.</p>'; $('geocheck').onchange=e=>e.target.checked?geoLayer.addTo(map):map.removeLayer(geoLayer);$('obscheck').onchange=e=>e.target.checked?obsLayer.addTo(map):map.removeLayer(obsLayer);}
else if(type==='species'){$('btnSpecies').classList.add('active');content.innerHTML='<h2>Ζώα · Φυτά · Μανιτάρια</h2><p class="muted">Διάλεξε ομάδα και εμφάνισε είδη που έχουν καταγραφεί γύρω από το σημείο σου.</p><select id="group"><option value="212">🐦 Πουλιά</option><option value="1">🐾 Ζώα</option><option value="6">🌱 Φυτά</option><option value="5">🍄 Μύκητες</option></select><select id="radius"><option value="5">Ακτίνα 5 χλμ.</option><option value="10" selected>Ακτίνα 10 χλμ.</option><option value="20">Ακτίνα 20 χλμ.</option></select><select id="month"><option value="">Όλες οι εποχές</option><option value="3,4,5">Άνοιξη</option><option value="6,7,8">Καλοκαίρι</option><option value="9,10,11">Φθινόπωρο</option><option value="12,1,2">Χειμώνας</option></select><button class="action" id="loadSpecies">Αναζήτηση ειδών</button><input type="search" id="speciesSearch" placeholder="Φιλτράρισμα ονόματος…"><div id="speciesStatus" class="muted"></div><div id="speciesList"></div><p class="muted">Προβάλλεται δείγμα έως 300 εγγραφών. Δεν είναι πλήρης κατάλογος. Οι ευαίσθητες τοποθεσίες δεν πρέπει να εμφανίζονται με ακρίβεια.</p>';$('loadSpecies').onclick=loadSpecies;$('speciesSearch').oninput=renderSpecies;}
}
function setBase(key){if(base?.layer)map.removeLayer(base.layer);let layer;if(key==='geology'){layer=L.tileLayer('https://tiles.macrostrat.org/carto/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© Macrostrat / source maps'});}else{const b=BASES[key];layer=L.tileLayer(b.url,{maxZoom:key==='topo'?17:19,attribution:b.attr});}layer.addTo(map);layer.bringToBack();base={key,layer};}
function showInfo(point){selected=point;if(marker)marker.remove();marker=L.marker(point).addTo(map);$('info').classList.add('open');$('infoContent').innerHTML=`<h2>📍 Πληροφορίες σημείου</h2><div class="metric"><span>Συντεταγμένες</span><b>${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}</b></div><div class="metric"><span>Υψόμετρο</span><b id="elevation">Ανάκτηση…</b></div><div class="metric"><span>Μητρικό πέτρωμα / γεωλογία</span><b id="rock">Ανάκτηση…</b></div><div class="metric"><span>Ζώνη βλάστησης</span><b>Δεν έχει χαρτογραφηθεί ακόμη</b></div><div class="notice">Η γεωλογική μονάδα δεν ταυτίζεται πάντοτε με το μητρικό υλικό του εδάφους. Για τη ζώνη βλάστησης απαιτείται εξειδικευμένο επιστημονικό επίπεδο.</div>`;loadPointData(point);}
let pointReq=0;async function loadPointData(p){const id=++pointReq;try{const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${p.lat.toFixed(5)}&longitude=${p.lng.toFixed(5)}`);const j=await r.json();if(id===pointReq)$('elevation').textContent=Number.isFinite(j.elevation?.[0])?Math.round(j.elevation[0])+' μ. (μοντέλο εδάφους)':'Μη διαθέσιμο';}catch{if(id===pointReq)$('elevation').textContent='Μη διαθέσιμο';}try{const r=await fetch(`https://macrostrat.org/api/v2/geologic_units/map?lat=${p.lat.toFixed(5)}&lng=${p.lng.toFixed(5)}&response=long`);const j=await r.json();const obj=Array.isArray(j.success?.data)?j.success.data[0]:j.success?.data;const label=obj?.name||obj?.strat_name||obj?.lith||obj?.lithology||obj?.descrip;if(id===pointReq)$('rock').textContent=label?String(label).slice(0,110):'Δεν υπάρχουν διαθέσιμα στοιχεία';}catch{if(id===pointReq)$('rock').textContent='Η υπηρεσία δεν ανταποκρίθηκε';}}
async function loadSpecies(){if(!selected)showInfo(map.getCenter());const status=$('speciesStatus');status.textContent='Αναζήτηση καταγραφών GBIF…';$('speciesList').innerHTML='';obsLayer.clearLayers();const id=++requestId,p=selected,radius=+$('radius').value,ring=[];for(let i=0;i<=36;i++){let a=2*Math.PI*i/36;ring.push(`${(p.lng+radius*Math.cos(a)/(111.2*Math.cos(p.lat*Math.PI/180))).toFixed(5)} ${(p.lat+radius*Math.sin(a)/111.2).toFixed(5)}`)}const params=new URLSearchParams({geometry:`POLYGON((${ring.join(',')}))`,taxonKey:$('group').value,hasCoordinate:'true',limit:'300'});if($('month').value)params.set('month',$('month').value);try{const res=await fetch('https://api.gbif.org/v1/occurrence/search?'+params);if(!res.ok)throw Error('GBIF '+res.status);const j=await res.json();if(id!==requestId)return;speciesRecords=j.results.filter(x=>x.species||x.scientificName);status.textContent=`${Number(j.count).toLocaleString('el-GR')} συνολικές εγγραφές στην περιοχή · εμφανίζονται έως 300 πρώτες.`;renderSpecies();}catch(e){if(id===requestId)status.textContent='Δεν ήταν δυνατή η φόρτωση GBIF. Έλεγξε τη σύνδεση ή δοκίμασε αργότερα.';}}
function renderSpecies(){const el=$('speciesList');if(!el)return;const q=$('speciesSearch').value.toLowerCase(),groups=new Map();for(const rec of speciesRecords){const name=rec.species||rec.scientificName;if(!name)continue;if(!groups.has(name))groups.set(name,[]);groups.get(name).push(rec)}const items=[...groups.entries()].filter(([n])=>n.toLowerCase().includes(q)).slice(0,80);el.innerHTML=items.length?items.map(([n,recs],i)=>`<div class="entry" data-name="${esc(n)}"><strong>${esc(n)}</strong><small>${recs.length} εγγραφές στο δείγμα · πάτησε για προβολή</small></div>`).join(''):'<p class="muted">Δεν βρέθηκαν είδη στο τρέχον δείγμα.</p>';el.querySelectorAll('.entry').forEach(node=>node.onclick=()=>highlightSpecies(node.dataset.name,groups.get(node.dataset.name)));}
function highlightSpecies(name,recs){obsLayer.clearLayers();let bounds=[];for(const x of recs){if(!Number.isFinite(x.decimalLatitude)||!Number.isFinite(x.decimalLongitude))continue;if(x.issues?.includes('COORDINATE_INVALID'))continue;const pos=[x.decimalLatitude,x.decimalLongitude];L.circleMarker(pos,{radius:6,color:'#174b39',fillColor:'#efb34e',fillOpacity:.85,weight:1}).bindPopup(`<b>${esc(name)}</b><br>Καταγραφή: ${esc(x.eventDate||x.year||'χωρίς ημερομηνία')}<br><a href="https://www.gbif.org/occurrence/${encodeURIComponent(x.key)}" target="_blank" rel="noopener">Πηγή GBIF</a>`).addTo(obsLayer);bounds.push(pos);}obsLayer.addTo(map);if(bounds.length)map.fitBounds(bounds,{padding:[50,50],maxZoom:12});$('speciesStatus').textContent=`${name}: ${bounds.length} σημεία από το δείγμα των εγγραφών. Δεν αποτελούν πληθυσμό ή βέβαιη παρουσία σήμερα.`;}
function init(){map=L.map('map',{zoomControl:false}).setView([40.09,22.36],10);L.control.zoom({position:'bottomright'}).addTo(map);obsLayer=L.layerGroup().addTo(map);geoLayer=L.tileLayer('https://tiles.macrostrat.org/carto/{z}/{x}/{y}.png',{opacity:.58,maxZoom:18,attribution:'© Macrostrat'});setBase('sat');map.on('click',e=>showInfo(e.latlng));$('btnBase').onclick=()=>showPanel('base');$('btnLayers').onclick=()=>showPanel('layers');$('btnSpecies').onclick=()=>showPanel('species');$('closeSheet').onclick=()=>{$('sheet').classList.remove('open');document.querySelectorAll('.rail button').forEach(b=>b.classList.remove('active'))};$('closeInfo').onclick=()=>$('info').classList.remove('open');$('btnHome').onclick=()=>map.setView([40.09,22.36],10);$('btnLocate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{const ll={lat:p.coords.latitude,lng:p.coords.longitude};map.setView(ll,13);showInfo(ll)},()=>alert('Δεν ήταν δυνατός ο εντοπισμός. Το GPS συνήθως απαιτεί HTTPS.'),{timeout:12000});$('pin').onclick=()=>showInfo(map.getCenter());}
function showFatalError(error){console.error("Terra Greece map initialization failed:",error);const overlay=document.createElement("div"),box=document.createElement("div"),title=document.createElement("h2"),message=document.createElement("p");overlay.className="error";title.textContent="Δεν φορτώθηκε ο χάρτης";message.textContent=error?.message||"Παρουσιάστηκε απρόσμενο σφάλμα κατά την αρχικοποίηση.";box.append(title,message);overlay.append(box);document.body.append(overlay);}
function boot(){try{if(!window.L)throw new Error("Δεν φορτώθηκε το τοπικό Leaflet (./vendor/leaflet/leaflet.js). Έλεγξε ότι το αρχείο υπάρχει στο repository.");init();}catch(error){showFatalError(error);}}boot();
</script></body></html>
